services:
  postgres:
    image: postgres:17
    container_name: payflow-postgres
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow_user
      POSTGRES_PASSWORD: payflow_pass
    ports:
      - "5432:5432"
    volumes:
      - payflow-pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: payflow-app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payflow
      SPRING_DATASOURCE_USERNAME: payflow_user
      SPRING_DATASOURCE_PASSWORD: payflow_pass
    ports:
      - "8080:8080"

volumes:
  payflow-pgdata: